<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Colby Shift Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome, {{ current_user.name }}!</h1>
                <p>Role: {{ current_user.role.title() }}</p>
            </div>

            <div class="dashboard-options">
                <div class="dashboard-btn secondary">
                    <div class="btn-content">
                        <h3>Your Profile</h3>
                        <p>Email: {{ current_user.email }}</p>
                        <p>Account Status: {{ 'Active' if current_user.is_active else 'Inactive' }}</p>
                    </div>
                </div>

                <div class="dashboard-btn secondary">
                    <div class="btn-content">
                        <h3>Quick Actions</h3>
                        <p>Shift management features coming soon...</p>
                    </div>
                </div>
            </div>

            <div class="login-footer">
                <p><a href="/logout">Sign out</a> | <a href="#">Help & Support</a></p>
            </div>
        </div>
    </div>
</body>

</html>
