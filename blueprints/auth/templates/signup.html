{% extends "base.html" %}

{% block title %}Sign Up - Colby Shift Management{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('auth.static', filename='signup.css') }}">
{% endblock %}

{% block header_subtitle %}Create your account{% endblock %}

{% block content %}
<form class="login-form" method="POST" action="{{ url_for('auth.shiftManagementSignUp') }}">
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="supervisor">Supervisor</option>
        </select>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </div>

    <div class="form-options">
        <div class="remember-me">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#" class="forgot-password">Terms of Service</a></label>
        </div>
    </div>

    <button type="submit" class="login-btn">Create Account</button>
</form>
{% endblock %}

{% block footer %}Already have an account? <a href="{{ url_for('auth.shiftManagementLogin') }}">Sign in here</a>{% endblock %}
